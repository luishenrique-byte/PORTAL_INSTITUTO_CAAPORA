# Compose de produção (Easypanel): nenhum serviço publica porta no servidor.
# O acesso externo é feito pelo proxy do Easypanel, pelos domínios configurados no painel
# (web -> porta 3000, api -> porta 8080).
# Para rodar na sua máquina com as portas abertas, veja docker-compose.local.yml.
services:
  # ---------- Banco de dados ----------
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-dbInstituto_Caapora}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-12345}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------- Backend (Spring Boot) ----------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # JWT_KEY, JWT_EXPIRATION etc. vêm do .env (opcional; sem ele usa os padrões de desenvolvimento)
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${DB_NAME:-dbInstituto_Caapora}
      DATABASE_USERNAME: ${DB_USER:-postgres}
      DATABASE_PASSWORD: ${DB_PASSWORD:-12345}
      DDL_AUTO: ${DDL_AUTO:-update}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      UPLOADS_DIR: /app/uploads
      # As datas do backend são LocalDateTime (sem fuso): a JVM precisa usar o horário de Brasília
      JAVA_TOOL_OPTIONS: -Duser.timezone=${TZ_APP:-America/Sao_Paulo}
    expose:
      - "8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/v3/api-docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ---------- Frontend (Next.js) ----------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Endereço da API visto pelo navegador do usuário (não pelo container)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    expose:
      - "3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  uploads:
